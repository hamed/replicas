name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Pinned so a new ruff release cannot turn this job red on its own. Keep
      # in step with the ruff pin in the dev extra.
      - name: Lint
        run: uvx ruff@0.16.0 check .

      - name: Check formatting
        run: uvx ruff@0.16.0 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.9. Older interpreters resolve
        # to pyspark 4.0.x, newer ones to 4.2.x; test both ends so a resolver
        # change does not silently break one of them.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install from a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev,plot]'

      # Installing from the declared dependencies alone, with nothing
      # preinstalled, is the point: an undeclared runtime dependency shows up
      # here as a failure rather than in a user's first bootstrap() call.
      - name: Run tests
        run: uv run --no-project pytest -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: minimum-dependencies

      - name: Install declared minimums
        run: |
          uv venv --python 3.9
          uv pip install -e . \
            'numpy==1.21.0' \
            'pandas==1.3.0' \
            'polars==1.0.0' \
            'pyspark==3.3.0' \
            'pyarrow==4.0.0' \
            'pytest==7.0.0'

      - name: Run tests
        env:
          JAVA_TOOL_OPTIONS: -Dio.netty.tryReflectionSetAccessible=true
        run: uv run --no-project pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify the wheel in a clean environment
        run: |
          uv venv --python 3.13 /tmp/replicas-wheel
          uv pip install --python /tmp/replicas-wheel/bin/python dist/*.whl
          uv pip check --python /tmp/replicas-wheel/bin/python
          /tmp/replicas-wheel/bin/python -c \
            "import importlib.metadata as m; import replicas; assert replicas.__version__ == m.version('replicas')"
