[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replicas"
version = "0.1.0"
description = "Bootstrap confidence intervals for classifier metrics on Spark."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hamed Seyed-Allaei" },
]
requires-python = ">=3.9"
keywords = [
    "bootstrap",
    "confidence-intervals",
    "classifier-metrics",
    "precision-recall",
    "pyspark",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyspark>=3.3",
    # PySpark warns on pandas >= 3.0 ("does not yet fully support"). Uncapped,
    # the newest interpreter resolved to the least-supported pandas.
    "pandas>=1.3,<3",
    "numpy>=1.21",
    # bootstrap.sample() uses applyInPandas, which requires Arrow serialization.
    "pyarrow>=4",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    # Pinned: lint results must match CI exactly, or the gate fails on a diff
    # you cannot reproduce locally.
    "ruff==0.16.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/hamed/replicas"
Issues = "https://github.com/hamed/replicas/issues"

[tool.setuptools.packages.find]
include = ["replicas*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# The notebook is the reference design, kept as it was executed. Ruff lints it
# as one module, which misreads three properties of a narrative notebook:
#
# E402  imports are introduced next to the cell that first needs them.
# I001  cell-local import order is authored, not sorted; sorting it produces a
#       diff on a file whose committed outputs would no longer match.
# F811  the setup cell re-imports `np` and `plt` on purpose. The cell above it
#       is marked "skip this cell, only for demonstration", so setup has to
#       stand on its own — `plot_pr` calls `plt.fill_between`. Ruff sees a
#       redefinition; a reader who skips as instructed sees a NameError once
#       the "redundant" import is removed.
"examples/*.ipynb" = ["E402", "I001", "F811"]

[tool.ruff.format]
# Prose, not source. The formatter rewrites Python inside README code blocks
# (dropping alignment chosen for readability) and rewrites every notebook cell.
# Both are still linted — only reformatting is off.
exclude = ["README.md", "examples/*.ipynb"]
